<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0b">
<title>Калейдоскоп</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калейдоскоп">
<link rel="icon" href="img/znak.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://kaleido-api.gmarbigm.workers.dev" crossorigin>
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="base.css?v=91578ed6">
<link rel="stylesheet" href="css/lenta.css?v=91578ed6">
<link rel="stylesheet" href="css/list.css?v=91578ed6">
<link rel="stylesheet" href="css/nastroiki.css?v=91578ed6">
</head>
<body>
<div class="player-box"><div></div></div>
<div class="player-box"><div></div></div>

<main id="feed">
  <section class="slide msg wait"><p>Подбираю ролики</p></section>
</main>

<button class="hint" id="hint"></button>

<div class="sheet" id="nast" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-box tall" role="dialog" aria-label="Настройки">
    <div class="sheet-head"><b>Настройки</b><button class="sheet-close" data-close>Готово</button></div>
    <div id="nast-body"></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-box" role="dialog" aria-label="Что нового">
    <div class="sheet-head"><b>Что нового</b><button class="sheet-close" data-close>Закрыть</button></div>
    <div id="sheet-list"></div>
  </div>
</div>

<script>
// Лента не загрузилась (файл не дошёл, например через VPN): сообщение и «Обновить» вместо вечного «Подбираю ролики»
function kaleidoFail() {
  var w = document.querySelector('.wait');
  if (!w || window.kaleido) return;
  w.innerHTML = '<p>Лента не загрузилась. Проверьте VPN и обновите страницу.</p><button class="main" onclick="location.reload()">Обновить</button>';
}
setTimeout(kaleidoFail, 20000);
</script>
<script type="module" src="js/lenta.js?v=91578ed6" onerror="kaleidoFail()"></script>
</body>
</html>
